<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">LINUX DO 佬友视频资源状态</title>
  <desc id="desc">按社区公开话题和当前入口核验的公益视频站与开源视频工具状态。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#121a31"/><stop offset="1" stop-color="#2b3152"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity=".2"/></filter>
    <style>
      .sans{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}
      .eyebrow{font-size:24px;font-weight:800;letter-spacing:4px;fill:#87e7d8}
      .h1{font-size:50px;font-weight:900;fill:#fff}
      .name{font-size:31px;font-weight:900;fill:#151d35}
      .body{font-size:21px;font-weight:560;fill:#424b63}
      .small{font-size:20px;font-weight:650;fill:#aeb8d8}
      .tag{font-size:19px;font-weight:850;fill:#151d35}
    </style>
  </defs>
  <rect width="1080" height="1350" rx="52" fill="url(#bg)"/>
  <circle cx="965" cy="115" r="195" fill="#6557d9" opacity=".85"/>
  <circle cx="40" cy="1290" r="200" fill="#ff8c66" opacity=".25"/>
  <g class="sans" transform="translate(76 76)">
    <text class="eyebrow" x="0" y="0">06 / 公益站与开源工具状态</text>
    <text class="h1" x="0" y="88">视频资源：先看现在还能不能用</text>
    <text x="2" y="139" font-size="23" font-weight="550" fill="#dce4ff">核验于 2026-08-23。无合作、无 AFF、不是付费排名；入口、注册、额度、</text>
    <text x="2" y="174" font-size="23" font-weight="550" fill="#dce4ff">模型都会变化，使用前先看原帖最新回复。</text>

    <g transform="translate(0 222)">
      <rect width="928" height="218" rx="34" fill="#fff" filter="url(#shadow)"/>
      <rect x="28" y="27" width="96" height="34" rx="17" fill="#9eebdf"/><text class="tag" x="76" y="51" text-anchor="middle">公益站</text>
      <text class="name" x="28" y="104">ZTU.AI</text>
      <text class="body" x="220" y="58">站点可打开 · 当前视频能力需现场核验</text>
      <text class="body" x="220" y="100">公开首页显示为 AI 生图平台；原帖曾记录文/图生视频。</text>
      <text class="body" x="220" y="142">不再把旧模型名写成当前固定能力。</text>
      <text class="small" x="28" y="188">ztu.ai　·　原帖 linux.do/t/topic/1507837</text>
    </g>

    <g transform="translate(0 470)">
      <rect width="928" height="218" rx="34" fill="#fff" filter="url(#shadow)"/>
      <rect x="28" y="27" width="142" height="34" rx="17" fill="#ffd6cf"/><text class="tag" x="99" y="51" text-anchor="middle">当前不可用</text>
      <text class="name" x="28" y="104">l0veyou</text>
      <text class="body" x="220" y="58">8 月 4–5 日已有连续打不开反馈</text>
      <text class="body" x="220" y="100">本次直接访问也未得到可用页面；等待站长后续消息。</text>
      <text class="body" x="220" y="142">历史 LTX / Kling / Wan 能力不再写成当前可用。</text>
      <text class="small" x="28" y="188">l0veyou.com　·　最新回复 linux.do/t/topic/2287218?page=35</text>
    </g>

    <g transform="translate(0 718)">
      <rect width="448" height="278" rx="34" fill="#dcd6ff" filter="url(#shadow)"/>
      <rect x="26" y="25" width="116" height="34" rx="17" fill="#fff"/><text class="tag" x="84" y="49" text-anchor="middle">开源推广</text>
      <text class="name" x="26" y="106">小野 AI</text>
      <text class="body" x="26" y="150">在线站已转为综合创作产品</text>
      <text class="body" x="26" y="188">首页主推对话、图片与商品视觉；</text>
      <text class="body" x="26" y="224">视频能力仍见于开源仓库说明。</text>
      <text class="small" x="26" y="260">linux.do/t/topic/1802932</text>

      <rect x="480" width="448" height="278" rx="34" fill="#ffd66b" filter="url(#shadow)"/>
      <rect x="506" y="25" width="154" height="34" rx="17" fill="#fff"/><text class="tag" x="583" y="49" text-anchor="middle">公益推广 / 开源</text>
      <text class="name" x="506" y="106">派奇绘画</text>
      <text class="body" x="506" y="150">现行仓库仍有 Wan 2.2 Live Motion</text>
      <text class="body" x="506" y="188">依赖 Hugging Face / Gitee AI 等上游；</text>
      <text class="body" x="506" y="224">列为自部署工具，不承诺公共额度。</text>
      <text class="small" x="506" y="260">linux.do/t/topic/1312332</text>
    </g>

    <rect x="0" y="1040" width="928" height="140" rx="30" fill="#87e7d8"/>
    <text x="30" y="1088" font-size="28" font-weight="900" fill="#151d35">做长视频不要一次生成一分钟</text>
    <text x="30" y="1130" font-size="23" font-weight="600" fill="#25304a">先拆场景和关键帧，再生成短片段、检查人物与镜头连续性，最后剪辑。</text>
    <text x="30" y="1165" font-size="20" font-weight="700" fill="#46516b">佬友教程：linux.do/t/topic/1833016　·　Seedance 踩坑：/t/topic/1834572</text>

    <text class="small" x="0" y="1242">这是社区资源状态索引；以原帖和站内公告为准，不替任何站点承诺可用性。</text>
  </g>
</svg>
