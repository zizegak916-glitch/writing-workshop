<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Writing Workshop 来源、验证与当前边界</title>
  <desc id="desc">说明上游来源、v0.2.5 自动验证和仍未完成的第三方验证。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff9ed"/><stop offset="1" stop-color="#f0ecff"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#1d2337" flood-opacity=".15"/></filter>
    <style>
      .sans{font-family:Inter,"Noto Sans SC","Microsoft YaHei",sans-serif}
      .eyebrow{font-size:24px;font-weight:800;letter-spacing:4px;fill:#6557d9}
      .h1{font-size:64px;font-weight:900;fill:#141c34}
      .h2{font-size:31px;font-weight:850;fill:#141c34}
      .body{font-size:25px;font-weight:540;fill:#414a60}
      .small{font-size:20px;font-weight:650;fill:#6a7284}
      .tag{font-size:22px;font-weight:850;fill:#141c34}
    </style>
  </defs>
  <rect width="1080" height="1350" rx="52" fill="url(#bg)"/>
  <circle cx="950" cy="116" r="190" fill="#ffd66b" opacity=".6"/>
  <circle cx="85" cy="1240" r="225" fill="#87e7d8" opacity=".38"/>
  <g class="sans" transform="translate(76 78)">
    <text class="eyebrow" x="0" y="0">04 / 哪些是真的，哪些还没有</text>
    <text class="h1" x="0" y="94">不拿自证冒充用户认可</text>

    <rect x="0" y="154" width="928" height="222" rx="34" fill="#141c34" filter="url(#shadow)"/>
    <text x="34" y="208" font-size="25" font-weight="850" fill="#87e7d8">来源</text>
    <text x="34" y="257" font-size="29" font-weight="850" fill="#fff">Go 写作引擎源自 voocel/ainovel-cli</text>
    <text x="34" y="305" font-size="24" font-weight="520" fill="#dce4ff">Apache-2.0；仓库保留上游版权、许可和提交历史。</text>
    <text x="34" y="345" font-size="24" font-weight="520" fill="#dce4ff">当前主要开发 Web 产品层、上下文工作流、能力协议和发布设施。</text>

    <text class="h2" x="0" y="452">v0.2.5 已有的公开证据</text>
    <g transform="translate(0 486)">
      <rect width="446" height="174" rx="30" fill="#fff" filter="url(#shadow)"/>
      <rect x="482" width="446" height="174" rx="30" fill="#fff" filter="url(#shadow)"/>
      <text class="tag" x="30" y="52">CI / Playwright</text>
      <text class="body" x="30" y="98">事务保存、v1–v4→v5、</text>
      <text class="body" x="30" y="136">候选恢复、Pages API 等</text>
      <text class="tag" x="512" y="52">Release / Pages</text>
      <text class="body" x="512" y="98">v0.2.5 七个发布资产；</text>
      <text class="body" x="512" y="136">正式站资源校验一致</text>
    </g>

    <text class="h2" x="0" y="732">仍然不能声称已经完成</text>
    <rect x="0" y="766" width="928" height="260" rx="34" fill="#fff0ec" stroke="#ffb5a4" stroke-width="2"/>
    <circle cx="38" cy="820" r="10" fill="#de654c"/><text class="body" x="68" y="829">第三方代码型 Skill 沙箱：只有协议、登记和拒绝边界</text>
    <circle cx="38" cy="878" r="10" fill="#de654c"/><text class="body" x="68" y="887">浏览器项目 ↔ 后端项目双向同步：目前只有显式导入</text>
    <circle cx="38" cy="936" r="10" fill="#de654c"/><text class="body" x="68" y="945">任意供应商生产网络兼容：CI 使用本地协议模拟服务</text>
    <circle cx="38" cy="994" r="10" fill="#de654c"/><text class="body" x="68" y="1003">独立用户认可：当前还缺连续使用和外部贡献证据</text>

    <rect x="0" y="1064" width="928" height="132" rx="30" fill="#dcd6ff"/>
    <text class="h2" x="30" y="1112">这次真正想收集的</text>
    <text class="body" x="30" y="1156">不是点赞数字，而是佬友用一整章后给出的复现步骤：</text>
    <text class="body" x="30" y="1190">哪里丢数据、哪里误写、哪个接口不兼容。反馈不需要提交私稿。</text>

    <text class="small" x="0" y="1238">原话题 linux.do/t/2277200　·　上游话题 linux.do/t/topic/2267839</text>
    <text class="small" x="0" y="1265">Release github.com/zizegak916-glitch/writing-workshop/releases/tag/v0.2.5</text>
  </g>
</svg>
